mode: train
experiment_path: ${oc.env:FL4N_EXP_ROOT,./exps}/${now:%b%d_%H%M%S}_fl4n
seed: 0
precision: bf16-mixed
devices: 4
num_nodes: 1
find_unused_parameters: true
val_check_interval: 1000
limit_val_batches: 16
log_every_n_steps: 1
vis_every_n_steps: 500
ckpt_every_n_steps: 2000
ckpt_path: null
eval_out: null
data_root: ${oc.env:FL4N_DATA,data}

model:
  _target_: models.fl4n.FL4N
  depth: 12
  hidden_size: 768
  patch_size: 8
  num_heads: 12
  static_depth: 24
  dyn_depth: 8
  time_depth: 2
  freeze_patch_embed: false
  dyn_warm_start: true
  pretrained_path: ${oc.env:LAGERNVS_CKPT,checkpoints/lagernvs.pt}

loss:
  _target_: loss.RenderingLoss
  l2_weight: 1.0
  perceptual_weight: 0.5
  dyn_perceptual_weight: 2.0
  dyn_perceptual_size: 128
  dyn_grad_weight: 1.0
  dyn_mask_weight: 1.0

trainer:
  max_steps: 250001
  grad_clip_norm: 3.0
  optimizer:
    lr: 3.5e-5
    weight_decay: 0.05
    betas: [0.9, 0.95]
  scheduler:
    name: cosine
    warmup_steps: 3000
    hold_steps: 0
    cosine_min_range: 0.0
    step_factor: 0.1

data:
  im_size_hw: [336, 512]
  num_cond_views: 8
  num_tgt_views: 12
  zero_out_cam_cond_p: 0.4
  batch_size: 2
  num_workers: 4
  pin_memory: true

  dataset:
    _target_: data.sources.camxtime.CamXTimeDataset
    root_path: ${data_root}/CamxTime
    num_tgt_views: ${data.num_tgt_views}
    num_frames: 120
    grid_novel_ratio: 0.25
    grid_novel_time_ratio: 0.33
    mask_root: ${data_root}/masks/camxtime
    train_frac: 0.9

  secondaries:
    - mix_ratio: 1.0
      im_size_hw: [336, 512]
      num_cond_views: 8
      zero_out_cam_cond_p: 0.4
      dataset:
        _target_: data.sources.kubric4d.Kubric4DDataset
        root_path: ${data_root}/Kubric4D
        split_subdir: train
        num_tgt_views: 12
        grid_novel_ratio: 0.25
        grid_novel_time_ratio: 0.33
        stride_choices: [4, 8]
        mask_roots:
          4: ${data_root}/masks/kubric4d_gap4
          8: ${data_root}/masks/kubric4d_gap8
        return_dyn_mask: true
        train_frac: 0.9

  val_only:
    - im_size_hw: [512, 512]
      num_cond_views: 12
      zero_out_cam_cond_p: 1.0
      dataset:
        _target_: data.sources.nvidia.NvidiaDataset
        root_path: ${data_root}/NVIDIA
        num_target_cams: 3
        keep_aspect: true
    - im_size_hw: [336, 512]
      num_cond_views: 8
      zero_out_cam_cond_p: 0.0
      dataset:
        _target_: data.sources.kubric4d.Kubric4DDataset
        root_path: ${data_root}/Kubric4D
        split_subdir: test
        num_tgt_views: 12
        eval_cond_pairs: [[0, 0], [2, 8], [4, 17], [6, 25], [8, 34], [10, 42], [12, 51], [14, 59]]
        eval_target_pairs: [[0, 8], [2, 17], [4, 25], [6, 34], [8, 42], [10, 51], [12, 59], [14, 0], [1, 0], [5, 17], [9, 34], [13, 51]]
        return_dyn_mask: true
